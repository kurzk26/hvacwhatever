[build]
  command = "npm run build"
  publish = "."

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200
  force = true

[[headers]]
  for = "/admin/config.yml"
  [headers.values]
    Content-Type = "text/yaml; charset=utf-8"
    Cache-Control = "no-cache"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[build.environment]
  NODE_VERSION = "22"
